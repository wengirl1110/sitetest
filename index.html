<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>민원서비스 찾기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="container">
      <p class="eyebrow">민원서비스 안내</p>
      <h1>원하는 민원서비스를 빠르게 찾아보세요</h1>
      <p class="hero-text">서비스명을 검색하거나 민원분야를 선택하면 필요한 서비스를 간편하게 확인할 수 있습니다.</p>
    </div>
  </header>

  <main class="container">
    <section class="search-panel" aria-label="민원서비스 검색 및 필터">
      <div class="field search-field">
        <label for="keyword">서비스명 검색</label>
        <div class="input-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="keyword" type="search" placeholder="예: 여권, 주민등록, 건축" autocomplete="off">
        </div>
      </div>

      <div class="field">
        <label for="category">민원분야</label>
        <select id="category">
          <option value="">전체 분야</option>
        </select>
      </div>

      <button id="resetBtn" class="reset-btn" type="button">검색 초기화</button>
    </section>

    <section class="result-section">
      <div class="result-head">
        <h2>민원서비스 목록</h2>
        <p id="resultCount" class="result-count" aria-live="polite">총 0건</p>
      </div>

      <div id="loading" class="state-message">민원서비스 목록을 불러오는 중입니다.</div>
      <div id="error" class="state-message error" hidden></div>
      <div id="serviceList" class="service-grid" aria-live="polite"></div>
      <div id="empty" class="state-message" hidden>검색 조건에 맞는 민원서비스가 없습니다.</div>
    </section>
  </main>

  <footer>
    <div class="container">민원서비스 검색 안내 페이지</div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
